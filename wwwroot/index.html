
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="format-detection" content="telephone=no">
            <meta name="format-detection" content="address=no">
            <meta name="description" content="点击卡片即可添加微信">
            <meta property="og:title" content="这里有家千层店">
            <meta property="og:description" content="点击卡片即可添加微信">
            <meta property="og:image" content="https://zyqr.online/uploads/wechat.png">
            <link id="lin" href="https://zyqr.online/uploads/title.jpg" rel="shortcut icon" type="image/x-icon">
            <title>这里有家千层店</title>
            <style>
                body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f5f5f5;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }

            .container {
                width: 100%;
                max-width: 400px;
                padding: 40px 20px;
                text-align: center;
            }

            .card {
                background: white;
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                margin-bottom: 20px;
                animation: slideUp 0.5s ease;
            }

            .icon {
                width: 80px;
                height: 80px;
                margin: 0 auto 20px;
                border-radius: 20px;
                display: block;
            }

            .title {
                font-size: 20px;
                font-weight: 600;
                color: #333;
                margin: 0 0 8px;
            }

            .description {
                font-size: 14px;
                color: #666;
                margin: 0 0 25px;
            }

            .btn {
                display: inline-block;
                min-width: 200px;
                padding: 15px 30px;
                background: #07C160;
                color: white;
                font-size: 16px;
                font-weight: 500;
                text-decoration: none;
                border-radius: 25px;
                border: none;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 5px 15px rgba(7, 193, 96, 0.3);
            }

            .btn:active {
                transform: scale(0.98);
                box-shadow: 0 2px 8px rgba(7, 193, 96, 0.3);
            }

            .loading {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.7);
                display: none;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 16px;
                backdrop-filter: blur(5px);
            }

            .loading.show {
                display: flex;
            }

            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            </style>
        </head>
        <body>
            <div class="container">
            <div class="card">
                <img class="icon" src="https://zyqr.online/uploads/wechat.png" alt="这里有家千层店">
                <h1 class="title">这里有家千层店</h1>
                <p class="description">点击卡片即可添加微信</p>
                <button class="btn" id="openMiniProgram">打开微信</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-content">
                <div class="loading-icon">
                    <svg width="30" height="30" viewBox="0 0 50 50">
                        <circle cx="25" cy="25" r="20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.248" stroke-dashoffset="47.124">
                            <animateTransform attributeName="transform" type="rotate" dur="1s" from="0 25 25" to="360 25 25" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <div class="loading-text">正在打开微信...</div>
            </div>
        </div>

            <script>
                var isWechat = /MicroMessenger/i.test(navigator.userAgent);
                var isAndroid = /Android/i.test(navigator.userAgent);
                var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
                var miniprogramScheme = "weixin://dl/business/?t=2gurtZfv3cj";

                var openBtn = document.getElementById('openMiniProgram');
                var loading = document.getElementById('loading');

                if (!isWechat && (isAndroid || isIOS)) {
                    tryOpenMiniProgram();
                }

                function tryOpenMiniProgram() {
                    loading.classList.add('show');
                    
                    fetch('https://zyqr.online/api/visit/QAabEQjQd4gU0326', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        link_id: 'QAabEQjQd4gU0326',
                        ip: '', // 服务端获取
                        user_agent: navigator.userAgent,
                        referer: document.referrer || '',
                        created_at: new Date().toISOString()
                    })
                }).then(response => response.json())
                  .then(data => {
                    if (data.status === 'expired') {
                      alert('该链接已达到访问上限');
                      return;
                    } else {
                        window.location.href = miniprogramScheme;
                    }
                    setTimeout(function() {
                        loading.classList.remove('show');
                    }, 1500);
                  });
                }

                openBtn.addEventListener('click', function() {
                    if (isWechat) {
                        window.location.href = miniprogramScheme;
                    } else {
                        tryOpenMiniProgram();
                    }
                });
            </script>
        </body>
        </html>
